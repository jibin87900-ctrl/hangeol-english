<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한걸음 영어</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121826" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한걸음 영어">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: 게임형 학습 앱 — 위는 연속일·XP 바, 가운데 지그재그 학습 지도(단원 배너 + 원형 노드), 레슨은 전체 화면 오버레이(진행 바 / 문제 / 하단 정답 시트). 버튼은 아래 그림자로 눌리는 입체 블록 */
:root{
  --bg:#FFFFFF; --bg2:#F3F5FA; --surface:#FFFFFF; --ink:#1E2433; --muted:#6B7385; --line:#E3E7EF; --line-d:#CDD3DF;
  --blue:#2F6BFF; --blue-d:#1D4FD6; --blue-soft:#E6EEFF; --blue-ink:#1D4FD6;
  --green:#1FAE6C; --green-d:#13804E; --green-soft:#DDF6EA; --green-ink:#0F7546;
  --red:#F0504E; --red-d:#C73634; --red-soft:#FDE4E4; --red-ink:#B32A28;
  --sun:#FFB400; --sun-d:#D18F00; --sun-soft:#FFF3D1;
  --coral:#FF7A45; --coral-d:#D45A28; --grape:#8B5CF6; --grape-d:#6A3BD6; --teal:#0FB0B0; --teal-d:#0A8585;
  --lock:#E5E8EF; --lock-d:#C9CEDA; --lock-ink:#A3AABA;
  --f:"Nunito","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121826; --bg2:#0C111C; --surface:#1A2233; --ink:#EEF2F8; --muted:#9AA4B6; --line:#2B3648; --line-d:#1F2838;
    --blue:#4D82FF; --blue-d:#2F5FD6; --blue-soft:#1C2B4D; --blue-ink:#9DB9FF;
    --green-soft:#123527; --green-ink:#6EE0A6; --red-soft:#3D1D1F; --red-ink:#FF9592; --sun-soft:#3A2E10;
    --lock:#2A3446; --lock-d:#1C2433; --lock-ink:#5E6A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121826; --bg2:#0C111C; --surface:#1A2233; --ink:#EEF2F8; --muted:#9AA4B6; --line:#2B3648; --line-d:#1F2838;
  --blue:#4D82FF; --blue-d:#2F5FD6; --blue-soft:#1C2B4D; --blue-ink:#9DB9FF;
  --green-soft:#123527; --green-ink:#6EE0A6; --red-soft:#3D1D1F; --red-ink:#FF9592; --sun-soft:#3A2E10;
  --lock:#2A3446; --lock-d:#1C2433; --lock-ink:#5E6A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{padding-top:env(safe-area-inset-top,0px)}
a.b3,a.scene{text-decoration:none}
.user-select-none{-webkit-user-select:none;user-select:none}
body{-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea{-webkit-user-select:text;user-select:text}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;font-weight:500;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.in-lesson{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
p,h1,h2,h3{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg{display:block}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:30px}
.stat-pills{display:flex;gap:14px;align-items:center}
.pill{display:flex;align-items:center;gap:5px;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:22px}
.pill.off{color:var(--lock-ink)}
.pill.fire{color:var(--coral)}
.pill.xp{color:var(--sun-d)}

main{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:16px}
.view > *{min-width:0}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.tab{appearance:none;border:2px solid transparent;background:none;color:var(--muted);font-size:12px;font-weight:800;padding:6px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}

/* 버튼·타일 공통 */
.b3{--c:var(--blue);--cd:var(--blue-d);appearance:none;border:0;border-radius:16px;background:var(--c);color:#fff;font-family:var(--f);font-weight:900;font-size:16px;letter-spacing:.02em;padding:13px 18px;min-height:52px;box-shadow:0 4px 0 var(--cd);cursor:pointer;transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.b3:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--cd)}
.b3:disabled{--c:var(--lock);--cd:var(--lock-d);color:var(--lock-ink);cursor:default}
.b3.green{--c:var(--green);--cd:var(--green-d)}
.b3.red{--c:var(--red);--cd:var(--red-d)}
.b3.sun{--c:var(--sun);--cd:var(--sun-d)}
.b3.ghost{background:var(--surface);color:var(--blue-ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.b3.ghost:active:not(:disabled){box-shadow:0 0 0 var(--line)}
.b3.wide{width:100%}
.b3 svg{width:22px;height:22px}
.link-btn{appearance:none;background:none;border:0;color:var(--muted);font-weight:800;font-size:14px;letter-spacing:.03em;cursor:pointer;padding:10px 6px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row > *{flex:1 1 140px}
.h-title{font-size:24px;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.lead{color:var(--muted);font-size:15px}
input[type="text"],textarea,select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg2);color:var(--ink);font:inherit;font-size:17px;font-weight:700}
input[type="text"]:focus,textarea:focus,select:focus{border-color:var(--blue);outline:none}
textarea{resize:none;line-height:1.45}
.lab{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.mascot{flex:none}

/* 학습 지도 */
.hero{display:flex;gap:14px;align-items:center}
.hero .bubble{flex:1;min-width:0}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:800;font-size:16px;line-height:1.45}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bubble small{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-top:2px}
.goal-bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.goal-bar i{display:block;height:100%;background:var(--sun);border-radius:6px;transition:width .5s}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.unit-banner{--c:var(--blue);--cd:var(--blue-d);border-radius:20px;background:var(--c);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 5px 0 var(--cd)}
.unit-banner small{display:block;opacity:.9;font-weight:900;letter-spacing:.08em;font-size:12px}
.unit-banner h2{font-size:20px;font-weight:900;letter-spacing:-.01em;margin-top:2px}
.unit-banner p{font-size:13px;opacity:.92;font-weight:700}
.guide-btn{flex:none;appearance:none;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:9px 12px;font-weight:900;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
.guide-btn svg{width:18px;height:18px}
.nodes{display:grid;justify-items:center;gap:22px;padding:34px 0 30px}
.node-wrap{position:relative;transform:translateX(calc(var(--x) * 1px))}
.node{--c:var(--blue);--cd:var(--blue-d);position:relative;width:76px;height:70px;border-radius:50%;border:0;background:var(--c);box-shadow:0 8px 0 var(--cd);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--cd)}
.node svg{width:34px;height:34px}
.node.lock{--c:var(--lock);--cd:var(--lock-d);color:var(--lock-ink)}
.node.done::after{content:"";position:absolute;inset:8px;border-radius:50%;border:3px solid rgba(255,255,255,.35)}
.node.cur::before{content:"";position:absolute;inset:-11px -11px -19px;border-radius:50%;border:6px solid var(--c);opacity:.28;animation:pulse 1.8s ease-in-out infinite}
.node-tip{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--c);font-weight:900;font-size:15px;padding:7px 14px;border-radius:12px;white-space:nowrap;animation:bob 1.8s ease-in-out infinite;pointer-events:none;letter-spacing:.04em}
.node-tip::after{content:"";position:absolute;left:50%;top:100%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
.path-end{text-align:center;padding:10px 0 20px;display:grid;justify-items:center;gap:10px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.28}50%{transform:scale(1.08);opacity:.12}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}

/* 레슨 오버레이 */
.lesson{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px)}
.ls-head{width:100%;max-width:640px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 6px;display:flex;align-items:center;gap:10px}
.x-btn{appearance:none;border:0;background:none;color:var(--lock-ink);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none;border-radius:12px}
.x-btn svg{width:26px;height:26px}
.prog{flex:1;height:18px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:9px;transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.prog i::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
.combo{flex:none;display:flex;align-items:center;gap:3px;font-weight:900;color:var(--coral);font-size:15px;min-width:44px;justify-content:flex-end}
.combo svg{width:20px;height:20px}
.ls-body{overflow-y:auto;-webkit-overflow-scrolling:touch}
.ls-in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;display:grid;gap:18px;align-content:start;min-height:100%}
.ls-in > *{min-width:0}
.kicker{font-size:13px;font-weight:900;letter-spacing:.06em;color:var(--grape)}
.q-title{font-size:23px;font-weight:900;letter-spacing:-.02em;line-height:1.3;text-wrap:balance}
.ls-foot{border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .2s}
.ls-foot.ok{background:var(--green-soft);border-color:transparent}
.ls-foot.bad{background:var(--red-soft);border-color:transparent}
.ls-foot-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 16px;display:grid;gap:12px}
.fb{display:flex;gap:12px;align-items:flex-start;animation:rise .25s ease-out}
.fb-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface)}
.fb-icon svg{width:24px;height:24px}
.fb h3{font-size:21px;font-weight:900}
.fb p{font-size:15px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.ls-foot.ok .fb h3,.ls-foot.ok .fb p,.ls-foot.ok .fb-icon{color:var(--green-ink)}
.ls-foot.bad .fb h3,.ls-foot.bad .fb p,.ls-foot.bad .fb-icon{color:var(--red-ink)}
.fb .en{font-family:var(--f);font-weight:900}
.ls-actions{display:flex;gap:10px;align-items:center}
.ls-actions .b3{flex:1}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

.tile{appearance:none;background:var(--surface);border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:14px 16px;font-family:var(--f);font-weight:800;font-size:18px;color:var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s;text-align:left;min-height:56px;overflow-wrap:anywhere}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 4px 0 var(--blue);color:var(--blue-ink)}
.tile.ok{border-color:var(--green);background:var(--green-soft);box-shadow:0 4px 0 var(--green);color:var(--green-ink)}
.tile.bad{border-color:var(--red);background:var(--red-soft);box-shadow:0 4px 0 var(--red);color:var(--red-ink);animation:shake .35s}
.tile.gone{opacity:.4;box-shadow:none;transform:translateY(4px);cursor:default}
.tile:disabled{cursor:default}
.opts{display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile.pic{display:grid;justify-items:center;gap:6px;text-align:center;padding:16px 8px 14px}
.tile.pic .emo{font-size:48px;line-height:1.1}
.tile.pic .t-en{font-size:17px}
.tile.center{text-align:center}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.match .col{display:grid;gap:10px;align-content:start}
.match .tile{text-align:center;font-size:16px;padding:12px 8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.say-row{display:flex;gap:12px;align-items:center}
.say-row .bubble{flex:1;min-width:0;font-size:19px}
.spk-row{display:flex;gap:14px;align-items:flex-end;justify-content:center;padding:6px 0}
.spk-big{--c:var(--blue);--cd:var(--blue-d);width:96px;height:96px;border-radius:26px;border:0;background:var(--c);box-shadow:0 6px 0 var(--cd);color:#fff;display:grid;place-items:center;cursor:pointer}
.spk-big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cd)}
.spk-big svg{width:46px;height:46px}
.spk-slow{width:64px;height:64px;border-radius:20px;font-size:12px;font-weight:900;display:grid;place-items:center;gap:0;padding:6px}
.spk-slow svg{width:28px;height:28px}
.spk-mini{appearance:none;width:44px;height:44px;border-radius:14px;border:0;background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d);display:grid;place-items:center;cursor:pointer;flex:none}
.spk-mini svg{width:22px;height:22px}
.spk-mini:active{transform:translateY(3px);box-shadow:none}

.intro{display:grid;justify-items:center;gap:8px;text-align:center;padding:18px 16px 20px}
.intro .emo{font-size:84px;line-height:1.1;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.intro .en{font-size:clamp(34px,10vw,44px);font-weight:900;letter-spacing:-.01em;line-height:1.15;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.intro .ko{font-size:21px;font-weight:900;color:var(--muted)}
.intro-ex{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border-top:2px dashed var(--line);padding-top:14px;margin-top:8px}
.intro-ex p{font-weight:800;font-size:17px}
.intro-ex p + p{font-weight:600;font-size:14px;color:var(--muted)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

.ans-zone{min-height:118px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:6px 0;background-image:repeating-linear-gradient(to bottom,transparent 0 54px,var(--line) 54px 56px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wt{appearance:none;background:var(--surface);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--line);padding:8px 13px;font-family:var(--f);font-weight:800;font-size:18px;color:var(--ink);cursor:pointer;height:46px}
.wt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.wt.used{background:var(--line);color:transparent;box-shadow:none;cursor:default}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--blue);margin:0 4px;height:1em;vertical-align:baseline}
.gram-q{font-size:22px;font-weight:900;line-height:1.5}
.rule{background:var(--blue-soft);border-radius:16px;padding:14px 16px;line-height:1.85;font-size:16px;font-weight:600}
.rule b{color:var(--blue-ink);font-weight:900}
.ex-list{display:grid;gap:10px}
.ex-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:16px}
.ex-item p{font-weight:800;font-size:17px}
.ex-item p + p{font-weight:600;font-size:14px;color:var(--muted)}
.speak-target{display:flex;gap:12px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:16px}
.speak-target .en{font-size:21px;font-weight:900;line-height:1.35}
.speak-target .ko{font-size:14px;color:var(--muted);font-weight:700}
.hint-line{font-size:13.5px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:flex-start}
.hint-line svg{width:18px;height:18px;flex:none;margin-top:1px}
.type-q{display:flex;align-items:center;gap:16px}
.type-q .emo{font-size:64px;line-height:1}
.toks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tok{padding:2px 9px;border-radius:8px;font-weight:900;font-size:15px}
.tok.ok{background:var(--surface);color:var(--green-ink)}
.tok.miss{background:var(--surface);color:var(--red-ink);text-decoration:line-through}

.result{display:grid;justify-items:center;text-align:center;gap:14px;padding-top:20px}
.result h2{font-size:28px;font-weight:900;color:var(--sun-d);letter-spacing:-.02em}
.result .sub{font-weight:700;color:var(--muted)}
.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:420px}
.rstat{border-radius:16px;border:2px solid var(--c);overflow:hidden;display:grid}
.rstat span{background:var(--c);color:#fff;font-size:12px;font-weight:900;letter-spacing:.06em;padding:4px 0}

/* 시트 */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(10,15,25,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:rise .25s ease-out}

.w-list{list-style:none;margin:0 0 12px;padding:0;display:grid}
.w-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 2px;background:none;border:0;border-top:2px solid var(--line);text-align:left;cursor:pointer}
.w-row .emo{font-size:26px;text-align:center}
.w-row b{display:block;font-size:17px;font-weight:900}
.w-row span.ko{display:block;font-size:13.5px;color:var(--muted);font-weight:700;overflow-wrap:anywhere}
.lvl{display:flex;gap:3px}
.lvl i{width:6px;height:16px;border-radius:3px;background:var(--line)}
.lvl i.on{background:var(--sun)}
.ai-status{font-size:14px;color:var(--muted);font-weight:700}

.big-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.bstat svg{width:32px;height:32px;flex:none}
.bstat b{display:block;font-size:22px;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}
.bstat span{font-size:12.5px;color:var(--muted);font-weight:800}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px;padding-top:18px}
.wk{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:4px;height:100%}
.wk em{font-style:normal;font-size:11px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.wk .col{width:100%;max-width:30px;display:flex;align-items:flex-end;height:100%;background:var(--bg2);border-radius:8px;overflow:hidden}

.wk .col i.met{background:var(--green)}
.wk span{font-size:12px;font-weight:800;color:var(--muted)}
.wk.today span{color:var(--blue-ink)}
.settings{display:grid;gap:16px}
.set-row{display:grid;gap:6px}
.check{display:flex;gap:12px;align-items:center;font-size:15.5px;font-weight:800}
.check input{width:22px;height:22px;accent-color:var(--blue)}
.sync{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;font-weight:700}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--sun);flex:none}
.sync.cloud i{background:var(--green)}

/* 대화 */
.scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.scene{appearance:none;padding:16px 14px;border-radius:18px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);background:var(--surface);text-align:left;cursor:pointer;display:grid;gap:4px;align-content:start}
.scene:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.scene .emo{font-size:34px;line-height:1.1}
.scene b{font-size:15.5px;font-weight:900}
.scene span{font-size:13px;color:var(--muted);font-weight:700}
.room-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.room-head h2{font-size:19px;font-weight:900}
.log{display:grid;gap:12px}
.ai-line{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg{padding:12px 15px;border-radius:18px;display:grid;gap:6px;min-width:0}
.msg.ai{background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:6px}
.msg.me{justify-self:end;max-width:86%;background:var(--blue);color:#fff;border-bottom-right-radius:6px;font-size:16.5px;font-weight:700;overflow-wrap:anywhere}
.msg .en{font-size:18px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}
.msg .ko{font-size:13.5px;color:var(--muted);font-weight:700}
.msg .tools{display:flex;gap:8px}
.chip{appearance:none;border:2px solid var(--line);background:var(--bg2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink)}
.chip svg{width:16px;height:16px}
.fix{justify-self:end;max-width:86%;background:var(--green-soft);border-radius:16px;padding:10px 14px;font-size:14px;display:grid;gap:4px;min-width:0;color:var(--ink);font-weight:600}
.fix .lab2{font-size:12px;font-weight:900;color:var(--green-ink);letter-spacing:.03em}
.fix .en{font-size:17px;color:var(--green-ink);font-weight:900;overflow-wrap:anywhere}
.typing{display:flex;gap:5px;padding:16px 18px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err{background:var(--red-soft);color:var(--red-ink);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;display:grid;gap:10px}
.hints{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hints .small{width:100%;font-weight:800}
.hint-chip{appearance:none;font-size:15px;font-weight:800;border:2px dashed var(--blue);color:var(--blue-ink);background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;text-align:left}
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.composer .b3{min-height:54px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14.5px;font-weight:800;max-width:calc(100% - 32px);text-align:center}
#confetti{position:fixed;inset:0;z-index:35;pointer-events:none;width:100%;height:100%}
.mic-wrap{display:grid;justify-items:center;gap:8px;padding:4px 0}
.mic-big{width:100px;height:100px;border-radius:50%;border:0;background:var(--red);color:#fff;box-shadow:0 6px 0 var(--red-d);display:grid;place-items:center;cursor:pointer}
.mic-big svg{width:46px;height:46px}
.mic-big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--red-d)}
.mic-big.on{animation:micpulse 1.1s infinite}
@keyframes micpulse{0%{box-shadow:0 6px 0 var(--red-d),0 0 0 0 rgba(240,80,78,.45)}100%{box-shadow:0 6px 0 var(--red-d),0 0 0 26px rgba(240,80,78,0)}}
.mic-lab{font-weight:900;color:var(--muted);font-size:15px}
.qtext{font-weight:800;font-size:15.5px}
.banner-btns{display:grid;gap:6px;flex:none}
.backup-card{display:flex;gap:12px;align-items:center;border-color:var(--blue)}
.backup-card div{flex:1;min-width:0}
.backup-card b{display:block;font-size:15.5px;font-weight:900}
.backup-card span{font-size:13px;color:var(--muted);font-weight:700}
.backup-card .b3{flex:none;min-height:46px;padding:10px 14px}
.news{display:grid;gap:12px}
.news-item{display:grid;gap:2px;border-top:2px solid var(--line);padding-top:10px}
.news-t{font-weight:900;font-size:15.5px}
.news-b{font-size:14px;color:var(--muted);font-weight:600}
.new-badge{display:inline-block;background:var(--sun);color:#3A2A00;font-size:11px;font-weight:900;padding:1px 7px;border-radius:999px;letter-spacing:.04em;vertical-align:1px}
.feature{--c:var(--grape);--cd:var(--grape-d);background:var(--c);color:#fff;border-radius:20px;box-shadow:0 5px 0 var(--cd);padding:16px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.feature > div{min-width:0;flex:1}
.feature small{font-weight:900;letter-spacing:.06em;font-size:12px;opacity:.95}
.feature h3{font-size:20px;font-weight:900;margin:2px 0}
.feature p{font-size:13.5px;font-weight:700;opacity:.92;overflow-wrap:anywhere}

.done-chip{display:flex;gap:4px;align-items:center;font-weight:900;flex:none}
.done-chip svg{width:20px;height:20px}
.expr{display:grid;gap:12px;border-color:var(--sun)}
.expr-head{display:flex;justify-content:space-between;align-items:center;gap:10px}

.expr-en{font-size:24px;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.expr-ko{font-weight:800;color:var(--muted)}
.expr-note{font-size:14.5px;font-weight:600;background:var(--sun-soft);border-radius:12px;padding:10px 12px}
.expr-past summary{cursor:pointer;list-style:none;font-weight:900;font-size:14.5px;color:var(--sun-d);padding:4px 0}
.expr-past summary::-webkit-details-marker{display:none}
.expr-past-list{display:grid;gap:8px;margin-top:10px}
.sec-title{font-size:18px;font-weight:900;margin-top:12px}
.dlg{display:grid;gap:10px}
.dlg-line{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center}
.dlg-who{font-size:12px;font-weight:900;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.dlg-bub{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;min-width:0}

.dlg-bub .ko{font-size:13.5px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

let actx = null;
function tone(seq){
  if (!S.settings.sound) return;
  try {
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    if (actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime + 0.01;
    seq.forEach(([f, st, dur, type, vol]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + st);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + st + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + st + dur);
      o.connect(g); g.connect(actx.destination); o.start(t0 + st); o.stop(t0 + st + dur + 0.03);
    });
  } catch (e) {}
}

function pickVoice(){
  const pref = ["Samantha", "Google US English", "Microsoft Aria", "Microsoft Jenny", "Karen", "Daniel"];
  for (const p of pref){ const v = voices.find(x => x.name.indexOf(p) >= 0); if (v) return v; }

}

/* ═════════ 문제 만들기 ═════════ */
function unitWordsOf(w){ return allWords().filter(x => x.uid === w.uid); }
function distract(w, n, key){
  key = key || "en";
  const seen = new Set([String(w[key]).toLowerCase()]); const out = [];
  const pools = [shuffle(unitWordsOf(w)), shuffle(allWords())];
  pools.forEach(p => p.forEach(x => { const k = String(x[key]).toLowerCase(); if (out.length < n && !seen.has(k)){ seen.add(k); out.push(x); } }));
  return out;
}
function gramSteps(u){ return u.tips.reduce((a, gi) => a.concat(GRAMMAR[gi].qz.map(q => ({t:"gram", q, g:gi}))), []); }
function stepsFor(node){
  const u = node.u, ws = u.words, half = Math.ceil(ws.length / 2), A = ws.slice(0, half), B = ws.slice(half);
  const sents = sentencesOf(u); const st = [];
  if (node.k === "l1" || node.k === "l2"){
    const set = node.k === "l1" ? A : B;
    set.forEach((w, i) => { st.push({t:"intro", w}); st.push({t: i % 2 ? "pickKo" : "pickEn", w}); });
    pickN(set, 3).forEach(w => st.push({t:"listen", w}));
    if (node.k === "l2") pickN(A, 2).forEach(w => st.push({t:"pickEn", w}));
    if (set.length >= 3) st.push({t:"match", ws: set.slice(0, 5)});
  } else if (node.k === "l3"){
    if (u.dialog && u.dialog.length) st.push({t:"dialog", u});
    u.tips.forEach(gi => st.push({t:"tip", g:gi}));
    pickN(gramSteps(u), 4).forEach(x => st.push(x));
    pickN(sents, 4).forEach(s => st.push({t:"build", s}));
    if (ws.length >= 4) st.push({t:"match", ws: pickN(ws, 5)});
  } else if (node.k === "l4"){
    const ss = pickN(sents, 5);
    ss.slice(0, 3).forEach(s => st.push({t:"listenBuild", s}));
    pickN(ws, 3).forEach(w => st.push({t:"listen", w}));
    ss.slice(3, 5).forEach(s => st.push({t:"speak", s}));
    pickN(ws, 2).forEach(w => st.push({t:"type", w}));
  } else {
    const mid = [];
    pickN(ws, 3).forEach(w => mid.push({t:"pickEn", w}));
    pickN(ws, 3).forEach(w => mid.push({t:"type", w}));
    pickN(sents, 2).forEach(s => mid.push({t:"build", s}));
    pickN(sents, 1).forEach(s => mid.push({t:"listenBuild", s}));
    pickN(gramSteps(u), 2).forEach(x => mid.push(x));
    shuffle(mid).forEach(x => st.push(x));
    if (ws.length >= 4) st.push({t:"match", ws: pickN(ws, 5)});
  }
  return st;
}
function weakCount(){ return Math.min(8, Object.keys(S.words).length); }
function weakSteps(){
  const tn = todayNum(); const all = allWords().filter(w => S.words[w.id]);
  const ws = all.sort((a, b) => (S.words[a.id].s - S.words[b.id].s) || (S.words[a.id].last - S.words[b.id].last)).slice(0, 8);
  const mid = [];
  pickN(ws, 3).forEach(w => mid.push({t:"pickEn", w}));
  pickN(ws, 2).forEach(w => mid.push({t:"listen", w}));
  pickN(ws, 3).forEach(w => mid.push({t:"type", w}));
  const st = shuffle(mid); if (ws.length >= 4) st.push({t:"match", ws: pickN(ws, 5)});
  void tn; return st;
}

const CONTR = {"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","let's":"let us","what's":"what is","that's":"that is","there's":"there is","where's":"where is","i'll":"i will","i've":"i have","okay":"ok"};
const NUMS = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
function norm(s){
  return String(s).toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).filter(Boolean)
    .reduce((a, w) => { w = w.replace(/^'+|'+$/g, ""); if (/^\d+$/.test(w) && +w <= 12) w = NUMS[+w]; return a.concat((CONTR[w] || w).split(" ")); }, []).filter(Boolean);
}
function lcsMatch(T, U){
  const n = T.length, m = U.length; const dp = [];
  for (let i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = T[i] === U[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Array(n).fill(false); let i = 0, j = 0;
  while (i < n && j < m){ if (T[i] === U[j]){ hit[i] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  return hit;
}
function showFb(ok, title, detail){

  setSkip(null); setMain("계속", true, ok ? "green" : "red");
  document.querySelectorAll("#ls-in button.tile, #ls-in button.wt").forEach(b => { b.disabled = true; });

function check(){
  const st = L.queue[0]; let ok = false, detail = "";
  if (st.t === "pickEn" || st.t === "pickKo" || st.t === "listen"){
    if (L.sel == null) return;
    ok = L.sel === st.w.id;
    detail = ok ? `<span class="en">${esc(st.w.en)}</span> · ${esc(st.w.ko)}` : `정답: <span class="en">${esc(st.w.en)}</span> · ${esc(st.w.ko)}`;
    document.querySelectorAll('#ls-in [data-act="pick"]').forEach(b => { if (b.dataset.v === st.w.id) b.classList.add("ok"); else if (b.dataset.v === L.sel) b.classList.add("bad"); });
    if (st.t === "listen" || ok) say(st.w.en);
  } else if (st.t === "gram"){
    if (L.sel == null) return;
    ok = +L.sel === st.q.a;
    const full = st.q.q.replace("___", st.q.o[st.q.a]);
    detail = (ok ? "" : "정답: ") + `<span class="en">${esc(full)}</span>${st.q.k ? " · " + esc(st.q.k) : ""}`;
    document.querySelectorAll('#ls-in [data-act="pick"]').forEach(b => { if (+b.dataset.v === st.q.a) b.classList.add("ok"); else if (b.dataset.v === String(L.sel)) b.classList.add("bad"); });
    say(full);
  } else if (st.t === "build" || st.t === "listenBuild"){
    if (!L.ans.length) return;
    const got = L.ans.map(k => normTok(st.tiles.find(x => x.k === k).t)).join(" ");
    ok = got === toks(st.s.en).map(normTok).join(" ");
    detail = (ok ? "" : "정답: ") + `<span class="en">${esc(st.s.en)}</span> · ${esc(st.s.ko)}`;
    say(st.s.en);
  } else if (st.t === "type"){
    const clean = s => String(s).trim().toLowerCase().replace(/[’‘]/g, "'").replace(/[.!?]+$/, "").replace(/\s+/g, " ");
    const v = clean($("#ls-text").value || ""), want = clean(st.w.en);
    if (!v) return;
    ok = v === want || v.replace(/^to /, "") === want.replace(/^to /, "");
    detail = (ok ? "" : "정답: ") + `<span class="en">${esc(st.w.en)}</span> · ${esc(st.w.ko)}`;
    say(st.w.en);
  } else if (st.t === "speak"){

    const T = norm(st.s.en), U = norm(said); const hit = lcsMatch(T, U);

    ok = score >= 70;

    L.combo = ok ? L.combo + 1 : 0; L.doneN++; L.queue.shift(); updateBar();
    showFb(ok, ok ? (score >= 95 ? "발음 완벽해요!" : "잘 말했어요!") : "조금 아쉬워요 · " + score + "%", `<span class="toks">${T.map((t, i) => `<span class="tok ${hit[i] ? "ok" : "miss"}">${esc(t)}</span>`).join("")}</span>`);
    return;
  } else return;
  L.graded++;
  if (st.w) touchWord(st.w, ok);
  if (st.w && !ok) L.missed.set(st.w.id, st.w);
  if (ok){ L.combo++; L.doneN++; L.queue.shift(); }
  else {
    L.mistakes++; L.combo = 0; const s2 = L.queue.shift();

function matchTap(side, id, btn){

/* ═════════ 마이크 (음성 인식) ═════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec = null;
function stopMic(){ if (rec){ const r = rec; rec = null; try { r.abort(); } catch (e) {} } }
function micStart(){
  if (!SR || !L || L.phase !== "answer") return;
  if (rec){ try { rec.stop(); } catch (e) {} return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  const btn = $("#mic-btn"), lab = $("#mic-lab"), tx = $("#ls-text");
  let finalText = "";
  const r = new SR(); rec = r;
  r.lang = "en-US"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  r.onresult = ev => {
    let t = ""; for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
    if (tx) tx.value = t; setMain("확인", t.trim().length > 0);
    if (ev.results[ev.results.length - 1].isFinal) finalText = t;
  };
  r.onerror = ev => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") toast("마이크 권한을 허용해 주세요. 안 되면 키보드 마이크를 써요");
    else if (ev.error === "no-speech") toast("소리가 안 들렸어요. 다시 눌러서 말해 보세요");
    else if (ev.error !== "aborted") toast("음성 인식이 잠깐 안 돼요. 키보드 마이크를 써 보세요");
  };
  r.onend = () => {
    const mine = rec === r; if (mine) rec = null;
    if (btn) btn.classList.remove("on"); if (lab) lab.textContent = "눌러서 말하기";
    if (mine && finalText.trim() && L && L.phase === "answer" && L.queue[0] && L.queue[0].t === "speak") check();
  };
  if (btn) btn.classList.add("on"); if (lab) lab.textContent = "듣고 있어요… 말해 보세요";
  try { r.start(); } catch (e) { rec = null; if (btn) btn.classList.remove("on"); if (lab) lab.textContent = "눌러서 말하기"; toast("마이크를 켜지 못했어요. 키보드 마이크를 써 보세요"); }
}

function skipAsk(ui){
  const u = allUnits()[ui]; if (!u) return;
  openSheet(`<div style="display:grid;justify-items:center;gap:12px;text-align:center">${mascot("happy", 84)}<h3>'${esc(u.name)}' 단원으로 건너뛸까요?</h3><p class="muted" style="font-weight:700">앞 단원들을 모두 완료로 표시하고, 그 단원 단어들은 '본 단어'로 넣어 둘게요. 약한 단어 복습에서 다시 연습할 수 있어요.</p></div><button class="b3 wide" data-act="skip-yes" data-u="${ui}">건너뛰기</button><button class="link-btn" data-act="sheet-close">취소</button>`);
}
function skipTo(ui){
  const units = allUnits(); const tn = todayNum(); let n = 0;
  units.slice(0, ui).forEach(u => {
    if (u.daily || u.ai) return;
    KINDS.forEach(k => { const id = u.id + "-" + k.k; if (!S.nodes[id]){ S.nodes[id] = {at: "skip"}; n++; } });
    u.words.forEach(w => { if (!S.words[w.id]) S.words[w.id] = {s: 2, n: 1, last: tn}; });
  });
  commit(); closeSheet(); toast(n ? "건너뛰었어요! 여기서부터 이어서 해요" : "이미 여기까지 왔어요");
  go("learn", true);
}

/* ═════════ 백업 · 복원 ═════════ */
let restoreOpen = false;
function doBackup(){
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  const fallback = () => openSheet(`<div class="sheet-head"><h3>백업 코드</h3><button class="x-btn" data-act="sheet-close" aria-label="닫기">${IC.x}</button></div><p class="muted" style="font-weight:700">아래 코드를 길게 눌러 전체 선택 후 복사해서 메모장이나 카톡에 보관하세요.</p><textarea rows="6" readonly>${esc(code)}</textarea>`);
  S.lastBackup = todayNum(); commit(); if (cur === "learn") renderLearn();
  try { navigator.clipboard.writeText(code).then(() => toast("백업 코드를 복사했어요. 카톡 '나와의 채팅'에 붙여 두세요"), fallback); } catch (e) { fallback(); }
}
function doRestore(){
  const raw = ($("#restore-in").value || "").trim(); if (!raw){ toast("백업 코드를 붙여 넣어 주세요"); return; }
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (!o || o.v !== 2) throw new Error("bad");
    adopt(o); ensureDay(); commit(); restoreOpen = false; toast("기록을 복원했어요!"); go("learn", true);
  } catch (e) { toast("코드가 올바르지 않아요. 처음부터 끝까지 다 복사됐는지 확인해 주세요"); }
}

/* ═════════ 축하 효과 ═════════ */
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"); cv.hidden = false;
  const dpr = Math.min(2, window.devicePixelRatio || 1); const W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; const c = cv.getContext("2d"); c.scale(dpr, dpr);
  const cols = ["#2F6BFF", "#1FAE6C", "#FFB400", "#FF7A45", "#8B5CF6", "#0FB0B0", "#F0504E"];
  const ps = []; for (let i = 0; i < 140; i++) ps.push({x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * 6 + 4, c: cols[i % cols.length], a: Math.random() * 6, va: (Math.random() - .5) * .3});
  const t0 = performance.now();
  (function frame(t){
    const el = t - t0; c.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va; c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.fillStyle = p.c; c.globalAlpha = Math.max(0, 1 - el / 2600); c.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); c.restore(); });
    if (el < 2600) requestAnimationFrame(frame); else { c.clearRect(0, 0, W, H); cv.hidden = true; }
  })(t0);
}

/* ═════════ 시트 (가이드 · 확인) ═════════ */
let guideTips = [];
function openSheet(html){ $("#sheet").innerHTML = html; $("#sheet-wrap").hidden = false; }
function closeSheet(){ $("#sheet-wrap").hidden = true; $("#sheet").innerHTML = ""; }
function openGuide(ui){
  const u = allUnits()[ui]; if (!u) return; guideTips = u.tips;
  openSheet(`<div class="sheet-head"><h3>${esc(u.name)} 가이드</h3><button class="x-btn" data-act="sheet-close" aria-label="닫기">${IC.x}</button></div>
    ${u.tips.map(gi => { const g = GRAMMAR[gi]; return `<div style="display:grid;gap:10px"><p style="font-weight:900;font-size:17px">${esc(g.t)}</p><div class="rule">${g.b}</div><div class="ex-list">${g.ex.map(e => `<div class="ex-item"><button class="spk-mini" data-act="say" data-text="${esc(e[0])}" aria-label="듣기">${IC.spk}</button><div><p>${esc(e[0])}</p><p>${esc(e[1])}</p></div></div>`).join("")}</div></div>`; }).join("")}`);
}
/* ═════════ 단어장 ═════════ */
function renderWords(){

    <div class="hero">${mascot("happy", 64)}<div class="bubble">지금까지 ${seen}개 단어를 봤고, ${strong}개는 확실히 외웠어요!<small>노란 막대가 많을수록 잘 아는 단어예요</small></div></div>
    <button class="b3 sun wide" data-act="weak"${seen < 4 ? " disabled" : ""}>${IC.bolt}약한 단어 복습${seen >= 4 ? " " + weakCount() + "개" : ""} +10 XP</button>
    <div class="unit-list">${units.map((u, ui) => {
      const known = u.words.filter(w => S.words[w.id] && S.words[w.id].s >= 4).length;
      return `<details class="u-item"><summary><span>${u.daily ? "NEW · " : u.ai ? "AI · " : (ui + 1) + ". "}${esc(u.name)}</span><span class="muted">${known}/${u.words.length} 익힘</span></summary>
        <ul class="w-list">${u.words.map(w => { const c = S.words[w.id]; const s = c ? c.s : 0;
          return `<li><button class="w-row" data-act="say" data-text="${esc(w.en)}"><span class="emo">${w.emo || "📘"}</span><span><b>${esc(w.en)}</b><span class="ko">${esc(w.ko)}</span></span><span class="lvl" aria-label="숙련도 ${s}/5">${[1,2,3,4,5].map(i => `<i class="${s >= i ? "on" : ""}"></i>`).join("")}</span></button></li>`; }).join("")}</ul></details>`;
    }).join("")}</div>`;
}
/* ═════════ 기록 ═════════ */
let resetArmed = false;
function renderMe(){
  ensureDay();
  const tn = todayNum(); const days = [];
  for (let i = 6; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate() - i); const k = todayStr(d); days.push({k, xp: S.hist[k] || 0, wd: WD[d.getDay()], today: i === 0}); }
  const mx = Math.max(S.settings.goal, ...days.map(d => d.xp));
  const doneNodes = Object.keys(S.nodes).length; const strong = Object.values(S.words).filter(c => c.s >= 4).length;
  void tn;
  $("#v-me").innerHTML = `<h1 class="h-title">내 기록</h1>
    <div class="big-stats">
      <div class="bstat"><span style="color:var(--coral)">${IC.fire}</span><div><b>${streakNow()}일</b><span>연속 학습 · 최고 ${S.best || 0}일</span></div></div>
      <div class="bstat"><span style="color:var(--sun)">${IC.bolt}</span><div><b>${S.xp || 0}</b><span>총 경험치</span></div></div>
      <div class="bstat"><span style="color:var(--green)">${IC.star}</span><div><b>${strong}</b><span>외운 단어 · 본 단어 ${Object.keys(S.words).length}</span></div></div>
      <div class="bstat"><span style="color:var(--blue)">${IC.trophy}</span><div><b>${doneNodes}</b><span>깬 단계 · 레슨 ${S.lessons || 0}번</span></div></div>
    </div>
    <div class="card"><p style="font-weight:900">최근 7일 경험치</p><p class="muted small" style="font-weight:700">초록 막대는 그날 목표(${S.settings.goal} XP)를 채운 날이에요</p>
      <div class="week">${days.map(d => `<div class="wk${d.today ? " today" : ""}"><em>${d.xp || ""}</em><div class="col"><i class="${d.xp >= S.settings.goal ? "met" : ""}" style="height:${d.xp ? Math.max(6, d.xp / mx * 100) : 0}%"></i></div><span>${d.today ? "오늘" : d.wd}</span></div>`).join("")}</div></div>
    ${NEWS.length ? `<div class="card news"><p style="font-weight:900;font-size:17px">앱 업데이트 소식</p>${NEWS.slice(0, 6).map(n => `<div class="news-item"><span class="muted small">${fmtDate(n.date)}${isNew(n.date) ? ' <span class="new-badge">NEW</span>' : ""}</span><p class="news-t">${esc(n.title)}</p>${n.body ? `<p class="news-b">${esc(n.body)}</p>` : ""}</div>`).join("")}</div>` : ""}
    <div class="card settings">
      <p style="font-weight:900;font-size:17px">설정</p>
      <div class="set-row"><label class="lab" for="set-goal">하루 목표</label>
        <select id="set-goal">${[[20,"가볍게 · 20 XP (약 10분)"],[30,"보통 · 30 XP (약 15분)"],[50,"열심히 · 50 XP (약 25분)"],[70,"빡세게 · 70 XP (약 35분)"]].map(o => `<option value="${o[0]}"${S.settings.goal == o[0] ? " selected" : ""}>${o[1]}</option>`).join("")}</select></div>
      <div class="set-row"><label class="lab" for="set-rate">발음 속도</label>
        <select id="set-rate">${[[0.7,"천천히"],[0.85,"보통 (추천)"],[1,"원어민 속도"]].map(o => `<option value="${o[0]}"${S.settings.rate == o[0] ? " selected" : ""}>${o[1]}</option>`).join("")}</select></div>
      <label class="check"><input type="checkbox" id="set-sound"${S.settings.sound ? " checked" : ""}> 효과음</label>
      <label class="check"><input type="checkbox" id="set-auto"${S.settings.auto ? " checked" : ""}> 단어와 AI 답을 자동으로 읽어 주기</label>
      <div class="set-row"><span class="lab">기록 백업 · 복원 (폰 바꿀 때)</span>
        <div class="row"><button class="b3 ghost" data-act="backup">백업 코드 복사</button><button class="b3 ghost" data-act="restore-open">복원하기</button></div>
        ${restoreOpen ? `<textarea id="restore-in" rows="3" placeholder="백업 코드를 붙여 넣으세요"></textarea><button class="b3" data-act="restore">이 기록으로 복원</button>` : ""}
      </div>
      <p id="sync" class="sync"></p>
      ${resetArmed ? `<p style="color:var(--red-ink);font-weight:800">모든 학습 기록이 지워져요. 정말 지울까요?</p><div class="row"><button class="b3 ghost" data-act="reset-no">취소</button><button class="b3 red" data-act="reset-yes">기록 지우기</button></div>`
        : `<button class="link-btn" data-act="reset" style="justify-self:start">학습 기록 처음부터 다시 하기</button>`}
    </div>`;
  renderSync();
}

/* ═════════ AI 대화 (Claude 페이지로 연결) ═════════ */
const AI_URL = "https://claude.ai/artifact/Jxnt9RAR19RqWtPUktuCcA";
function renderChat(){
  $("#v-chat").innerHTML = `<h1 class="h-title">AI 영어 대화</h1>
    <div class="hero">${mascot("happy", 68)}<div class="bubble">AI랑 하는 상황별 영어 대화는 Claude 페이지에서 해요!<small>처음 한 번은 Claude 계정 로그인이 필요해요</small></div></div>
    <div class="scenes">${SCENES.map(s => `<a class="scene" href="${AI_URL}#chat" target="_blank" rel="noopener"><span class="emo">${s.emo}</span><b>${esc(s.ko)}</b><span>${esc(s.tag)}</span></a>`).join("")}</div>

/* ═════════ 화면 전환 · 이벤트 ═════════ */
const VIEWS = ["learn", "chat", "words", "me"];
let cur = "learn";
function go(v, toCurrent){
  if (VIEWS.indexOf(v) < 0) v = "learn";
  cur = v; ensureDay(); renderTop();
  VIEWS.forEach(n => { $("#v-" + n).hidden = n !== v; const t = document.querySelector(`.tab[data-v="${n}"]`); if (n === v) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
  if (v === "learn") renderLearn();
  if (v === "chat") renderChat();
  if (v === "words") renderWords();
  if (v === "me") renderMe();
  if (v === "learn" && toCurrent){ const n = document.querySelector(".node.cur"); if (n) n.scrollIntoView({block:"center"}); else window.scrollTo(0, 0); }
  else window.scrollTo(0, 0);
}
function refresh(){ renderTop(); if (cur === "learn") renderLearn(); if (cur === "words") renderWords(); if (cur === "me") renderMe(); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "sheet-bg"){ if (e.target === b) closeSheet(); return; }
  if (a === "tab") go(b.dataset.v, b.dataset.v === "learn");
  else if (a === "say") say(b.dataset.text);
  else if (a === "say-slow") say(b.dataset.text, 0.55);
  else if (a === "node") nodeTap(b.dataset.id);
  else if (a === "weak"){ if (Object.keys(S.words).length >= 4) startLesson(weakSteps(), {weak:true}); }
  else if (a === "guide") openGuide(+b.dataset.u);
  else if (a === "sheet-close") closeSheet();
  else if (a === "ls-main") lsMain();
  else if (a === "ls-skip") lsSkip();
  else if (a === "quit-ask"){ if (L && L.phase === "finish"){ closeLesson(); return; } openSheet(`<div style="display:grid;justify-items:center;gap:12px;text-align:center">${mascot("sad", 90)}<h3>정말 그만둘까요?</h3><p class="muted" style="font-weight:700">지금 그만두면 이번 레슨 진행은 저장되지 않아요.</p></div><button class="b3 wide" data-act="sheet-close">계속 공부하기</button><button class="link-btn" data-act="quit" style="color:var(--red-ink)">그만두기</button>`); }
  else if (a === "quit") closeLesson();
  else if (a === "pick"){ if (!L || L.phase !== "answer") return; document.querySelectorAll('#ls-in [data-act="pick"]').forEach(x => x.classList.remove("sel")); b.classList.add("sel"); L.sel = b.dataset.v; if (b.dataset.say) say(b.dataset.say); else SND.tap(); setMain("확인", true); }
  else if (a === "m"){ if (L) matchTap(b.dataset.side, b.dataset.id, b); }
  else if (a === "bank"){ if (!L || L.phase !== "answer") return; const k = +b.dataset.k; if (L.ans.indexOf(k) < 0){ L.ans.push(k); SND.tap(); renderTiles(); } }
  else if (a === "ans"){ if (!L || L.phase !== "answer") return; const k = +b.dataset.k; L.ans = L.ans.filter(x => x !== k); renderTiles(); }
  else if (a === "mic") micStart();
  else if (a === "xq") exprAnswer(+b.dataset.o);
  else if (a === "say-all"){ if (L && L.queue[0] && L.queue[0].u) sayAll(L.queue[0].u.dialog.map(l => l.en)); }
  else if (a === "backup") doBackup();
  else if (a === "skip-ask") skipAsk(+b.dataset.u);
  else if (a === "skip-yes") skipTo(+b.dataset.u);
  else if (a === "restore-open"){ restoreOpen = !restoreOpen; renderMe(); }
  else if (a === "restore") doRestore();
  else if (a === "reset"){ resetArmed = true; renderMe(); }
  else if (a === "reset-no"){ resetArmed = false; renderMe(); }
  else if (a === "reset-yes"){ const keep = S.settings; S = freshState(); S.settings = keep; ensureDay(); resetArmed = false; commit(); toast("기록을 지웠어요. 처음부터 시작해요"); go("learn", true); }
});
document.addEventListener("input", e => {
  if (e.target.id === "ls-text" && L && L.phase === "answer") setMain("확인", e.target.value.trim().length > 0);
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "set-goal"){ S.settings.goal = parseInt(e.target.value, 10) || 50; ensureDay(); if (!S.day.goalMet && S.day.xp >= S.settings.goal) award(0); commit(); renderTop(); renderMe(); }
  else if (id === "set-rate"){ S.settings.rate = parseFloat(e.target.value) || 0.85; commit(); say("This is the new speed."); }
  else if (id === "set-sound"){ S.settings.sound = e.target.checked; commit(); if (S.settings.sound) SND.ok(); }
  else if (id === "set-auto"){ S.settings.auto = e.target.checked; commit(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#sheet-wrap").hidden){ closeSheet(); return; }
  if (e.key !== "Enter" || e.shiftKey || e.isComposing || e.keyCode === 229) return;
  if (L && !$("#lesson").hidden && $("#sheet-wrap").hidden && (e.target.id === "ls-text" || e.target === document.body || e.target.closest("#lesson"))){ e.preventDefault(); if (!$("#ls-main").disabled) lsMain(); }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible"){ const before = S.day && S.day.d; ensureDay(); if (before !== S.day.d && !L) refresh(); loadDaily(); }
});

/* ═════════ 시작 ═════════ */
const local = loadLocal(); if (local) adopt(local);
ensureDay();
try { mergeDaily(JSON.parse(localStorage.getItem(LS + "-daily") || "null")); } catch (e) {}
const hash = (location.hash || "").slice(1);
go(VIEWS.indexOf(hash) >= 0 ? hash : "learn", true);
loadDaily();
// 기기가 공간 정리할 때 공부 기록을 지우지 않도록 요청
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
window.__hg = { get L(){ return L; }, get S(){ return S; } };
if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
</script>
